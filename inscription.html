<!doctype html>
<html lang="fr-ca">
  <head>
    <meta charset="UTF-8" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscription — FacturaApp</title>

    <!-- Meta PWA & Thème -->
    <meta name="theme-color" content="#2563eb" />
    <meta
      name="description"
      content="Créer un compte sur FacturaApp pour gérer vos factures facilement."
    />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />

    <!-- CDN Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between"
  >
    <!-- Accessibilité : Lien d'évitement -->
    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 bg-blue-600 text-white px-4 py-2 rounded-lg z-50 focus:outline-none focus:ring-2 focus:ring-blue-400"
    >
      Aller au contenu principal
    </a>

    <!-- En-tête / Navigation -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
      <div
        class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center"
      >
        <a
          href="index.html"
          class="text-xl font-bold text-blue-600 hover:text-blue-700 transition focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-lg p-1"
          aria-label="FacturaApp - Accueil"
        >
          FacturaApp
        </a>
        <nav aria-label="Navigation principale">
          <ul class="flex items-center gap-4 sm:gap-6">
            <li>
              <a
                href="info.html"
                class="text-slate-600 hover:text-blue-600 font-medium transition focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-md px-2 py-1"
                >À propos de nous</a
              >
            </li>
            <li>
              <a
                href="contact.html"
                class="text-slate-600 hover:text-blue-600 font-medium transition focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-md px-2 py-1"
                >Nous contacter</a
              >
            </li>
            <li>
              <a
                href="connexion.html"
                class="border border-blue-600 text-blue-600 hover:bg-blue-50 transition rounded-lg px-4 py-2 font-medium focus:outline-none focus:ring-2 focus:ring-blue-500"
                >Connexion</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Contenu Principal / Formulaire d'inscription -->
    <main id="main-content" class="max-w-md w-full mx-auto px-6 py-12">
      <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
        <div class="text-center mb-8">
          <h1 class="text-2xl font-bold text-slate-900">Créer un compte</h1>
          <p class="text-sm text-slate-500 mt-2">
            Rejoignez-nous et commencez à gérer vos factures facilement.
          </p>
        </div>

        <form action="dashboard.html" method="POST" class="space-y-5">
          <!-- Nom complet -->
          <div>
            <label
              for="name"
              class="block text-sm font-medium text-slate-700 mb-1"
            >
              Nom complet
            </label>
            <input
              type="text"
              id="name"
              name="name"
              required
              placeholder="Jean Dupont"
              class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
            />
          </div>

          <!-- Adresse E-mail -->
          <div>
            <label
              for="email"
              class="block text-sm font-medium text-slate-700 mb-1"
            >
              Adresse e-mail
            </label>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="nom@exemple.com"
              class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
            />
          </div>

          <!-- Mot de passe -->
          <div>
            <label
              for="password"
              class="block text-sm font-medium text-slate-700 mb-1"
            >
              Mot de passe
            </label>
            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder="••••••••"
              class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
            />
          </div>

          <!-- Confirmation du mot de passe -->
          <div>
            <label
              for="confirm-password"
              class="block text-sm font-medium text-slate-700 mb-1"
            >
              Confirmer le mot de passe
            </label>
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              required
              placeholder="••••••••"
              class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
            />
          </div>

          <!-- Conditions d'utilisation -->
          <div class="flex items-start gap-2 pt-1">
            <input
              type="checkbox"
              id="terms"
              name="terms"
              required
              class="mt-1 rounded border-slate-300 text-blue-600 focus:ring-blue-500"
            />
            <label for="terms" class="text-xs text-slate-600">
              J'accepte les
              <a
                href="#"
                class="text-blue-600 hover:underline focus:outline-none focus:ring-1 focus:ring-blue-500 rounded"
                >conditions d'utilisation</a
              >
              et la
              <a
                href="#"
                class="text-blue-600 hover:underline focus:outline-none focus:ring-1 focus:ring-blue-500 rounded"
                >politique de confidentialité</a
              >.
            </label>
          </div>

          <!-- Bouton de soumission -->
          <button
            type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow-md transition duration-200 mt-2 focus:outline-none focus:ring-4 focus:ring-blue-200"
          >
            S'inscrire
          </button>
        </form>

        <!-- Lien vers la connexion -->
        <div class="mt-6 text-center text-sm text-slate-600">
          Vous avez déjà un compte ?
          <a
            href="connexion.html"
            class="text-blue-600 font-semibold hover:underline focus:outline-none focus:ring-1 focus:ring-blue-500 rounded"
            >Se connecter</a
          >
        </div>
      </div>
    </main>
  </body>
</html>
